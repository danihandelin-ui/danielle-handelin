<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframe A — Classic Linktree</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F5F0E8; --cream-deep:#EDE5D4; --terra:#C1673A; --terra-mute:#D4845E;
    --sage:#6B7F6E; --ink:#1E1A16; --ink-soft:#6B5F52; --border:rgba(30,26,22,0.10);
    --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'DM Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--font-body);line-height:1.6;
    min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(2rem,7vw,4rem) 1.5rem;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  .wrap{width:100%;max-width:440px;text-align:center}
  .avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 1.4rem;
    border:3px solid #fff;box-shadow:0 8px 28px rgba(30,26,22,.12)}
  .name{font-family:var(--font-display);font-size:2rem;font-weight:500;letter-spacing:.01em}
  .handle{color:var(--terra);font-size:.78rem;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;margin-top:.35rem}
  .bio{color:var(--ink-soft);font-size:.95rem;font-weight:300;margin:1rem auto 0;max-width:340px}
  .links{margin-top:2.2rem;display:flex;flex-direction:column;gap:1rem}
  .link{display:block;background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:1.1rem 1.4rem;font-size:1rem;font-weight:500;letter-spacing:.01em;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    box-shadow:0 2px 10px rgba(30,26,22,.04)}
  .link:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(30,26,22,.10);border-color:var(--terra-mute)}
  .link.primary{background:var(--terra);color:var(--cream);border-color:var(--terra)}
  .link .sub{display:block;font-weight:300;font-size:.8rem;opacity:.72;margin-top:.2rem;letter-spacing:0}
  .foot{margin-top:2.4rem;font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em}
  .foot a{color:var(--terra)}
</style>
</head>
<body>
  <div class="wrap">
    <img class="avatar" src="Headshot.png" alt="Danielle Handelin" />
    <h1 class="name">Danielle Handelin</h1>
    <div class="handle">Trace Strategies</div>
    <p class="bio">Helping teams make complicated operations feel simple and human. Start with the free audit guide.</p>

    <div class="links">
      <a class="link primary" href="#AUDIT_GUIDE_LINK">
        Free Audit Guide
        <span class="sub">Trace Strategies — download the guide</span>
      </a>
      <a class="link" href="#AI_COURSE_LINK">
        AI Course
        <span class="sub">Learn to put AI to work</span>
      </a>
    </div>

    <div class="foot">© <span id="y"></span> Danielle Handelin · <a href="#">Trace Strategies</a></div>
  </div>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>

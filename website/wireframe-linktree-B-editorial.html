<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframe B — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F5F0E8; --cream-deep:#EDE5D4; --terra:#C1673A; --terra-mute:#D4845E;
    --terra-pale:#EDD5C5; --sage:#6B7F6E; --ink:#1E1A16; --ink-soft:#6B5F52;
    --border:rgba(30,26,22,0.12); --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'DM Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--font-body);line-height:1.6;
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:clamp(2rem,6vw,4rem) 1.5rem;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit}
  .card{width:100%;max-width:520px}
  .head{display:flex;align-items:center;gap:1.3rem;padding-bottom:1.6rem;
    border-bottom:1px solid var(--border)}
  .avatar{width:88px;height:88px;border-radius:6px;object-fit:cover;flex:none;
    box-shadow:0 6px 22px rgba(30,26,22,.14)}
  .kicker{color:var(--terra);font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
  .name{font-family:var(--font-display);font-size:2.1rem;font-weight:500;line-height:1.05;margin-top:.2rem}
  .bio{color:var(--ink-soft);font-size:.95rem;font-weight:300;margin-top:1.4rem}
  .links{margin-top:1.8rem;display:flex;flex-direction:column;gap:0}
  .link{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:1.4rem .2rem;border-bottom:1px solid var(--border);transition:padding .2s ease}
  .link:hover{padding-left:.8rem}
  .link:hover .arrow{transform:translateX(4px);color:var(--terra)}
  .l-title{font-family:var(--font-display);font-size:1.5rem;font-weight:500}
  .l-desc{color:var(--ink-soft);font-size:.85rem;font-weight:300;margin-top:.15rem}
  .num{font-size:.72rem;color:var(--terra);font-weight:500;letter-spacing:.1em;margin-bottom:.2rem;display:block}
  .arrow{font-family:var(--font-display);font-size:1.6rem;color:var(--ink-soft);
    transition:transform .2s ease,color .2s ease;flex:none}
  .foot{margin-top:1.8rem;font-size:.72rem;color:var(--ink-soft);letter-spacing:.06em}
  @media(max-width:430px){.head{flex-direction:column;text-align:center;align-items:center}}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img class="avatar" src="Headshot.png" alt="Danielle Handelin" />
      <div>
        <div class="kicker">Trace Strategies</div>
        <h1 class="name">Danielle Handelin</h1>
      </div>
    </div>
    <p class="bio">I make complicated operations feel simple and human. Two ways to start working with Trace Strategies:</p>

    <div class="links">
      <a class="link" href="#AUDIT_GUIDE_LINK">
        <div>
          <span class="num">01</span>
          <div class="l-title">Free Audit Guide</div>
          <div class="l-desc">Spot the gaps in your operations</div>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="link" href="#AI_COURSE_LINK">
        <div>
          <span class="num">02</span>
          <div class="l-title">AI Course</div>
          <div class="l-desc">Put AI to work in your business</div>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
    </div>

    <div class="foot">© <span id="y"></span> Danielle Handelin · Trace Strategies</div>
  </div>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>

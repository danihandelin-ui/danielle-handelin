<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wireframe C — Bold / Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F5F0E8; --terra:#C1673A; --terra-mute:#D4845E; --sage:#A8B8A4;
    --ink:#1E1A16; --ink-2:#2A241E; --ink-soft:#9C8E7C; --border:rgba(245,240,232,0.14);
    --font-display:'Cormorant Garamond',Georgia,serif; --font-body:'DM Sans',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--cream);font-family:var(--font-body);line-height:1.6;
    min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(2rem,7vw,4rem) 1.5rem;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 50% 0%,rgba(193,103,58,.18),transparent 55%)}
  a{text-decoration:none;color:inherit}
  .wrap{width:100%;max-width:430px;text-align:center}
  .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 1.3rem;
    border:2px solid var(--terra);box-shadow:0 0 0 6px rgba(193,103,58,.12)}
  .name{font-family:var(--font-display);font-size:2.1rem;font-weight:500}
  .handle{color:var(--terra-mute);font-size:.76rem;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;margin-top:.4rem}
  .bio{color:var(--ink-soft);font-size:.92rem;font-weight:300;margin:1.1rem auto 0;max-width:330px}
  .links{margin-top:2.3rem;display:flex;flex-direction:column;gap:.9rem}
  .link{display:flex;align-items:center;justify-content:center;gap:.6rem;
    border:1px solid var(--border);border-radius:999px;padding:1.15rem 1.4rem;
    font-size:1rem;font-weight:500;letter-spacing:.02em;background:rgba(245,240,232,.03);
    transition:all .2s ease}
  .link:hover{background:rgba(245,240,232,.07);border-color:var(--terra)}
  .link.primary{background:var(--terra);border-color:var(--terra);color:#fff}
  .link.primary:hover{background:var(--terra-mute);border-color:var(--terra-mute)}
  .foot{margin-top:2.6rem;font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em}
  .foot a{color:var(--terra-mute)}
</style>
</head>
<body>
  <div class="wrap">
    <img class="avatar" src="Headshot.png" alt="Danielle Handelin" />
    <h1 class="name">Danielle Handelin</h1>
    <div class="handle">Trace Strategies</div>
    <p class="bio">Making complicated operations feel simple and human. Pick where to start:</p>

    <div class="links">
      <a class="link primary" href="#AUDIT_GUIDE_LINK">Free Audit Guide</a>
      <a class="link" href="#AI_COURSE_LINK">AI Course</a>
    </div>

    <div class="foot">© <span id="y"></span> Danielle Handelin · <a href="#">Trace Strategies</a></div>
  </div>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>

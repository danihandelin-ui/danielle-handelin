<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Palette + style sampled from drewhardman.com (TRACE) */
    --bg:#0A1714; --bg-2:#102A24; --bg-3:#15362E;
    --copper:#C08A56; --copper-deep:#9C6B43; --teal:#2E5A52;
    --card:rgba(255,255,255,.035); --card-bd:rgba(192,138,86,.22);
    --text:#F3F0E8; --text-dim:#BFD0C8;
    --ease:cubic-bezier(.16,1,.3,1);
    --font-display:'Bricolage Grotesque',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;
    min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(2rem,7vw,4rem) 1.5rem;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 50% -8%,rgba(192,138,86,.14),transparent 55%),
                     radial-gradient(circle at 50% 112%,rgba(46,90,82,.20),transparent 52%),
                     linear-gradient(180deg,var(--bg-2),var(--bg) 55%)}
  a{text-decoration:none;color:inherit}
  .wrap{width:100%;max-width:430px;text-align:center}

  /* Conic copper→teal→copper ring around the headshot (Drew Hardman style) */
  .avatar-ring{width:116px;height:116px;border-radius:50%;margin:0 auto 1.1rem;padding:3px;
    background:conic-gradient(from 210deg,var(--copper),var(--teal),var(--copper));
    box-shadow:0 6px 22px rgba(0,0,0,.40)}
  .avatar{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;
    border:3px solid var(--bg)}

  .name{font-family:var(--font-display);font-size:2.2rem;font-weight:700;letter-spacing:-.01em}
  .handle{font-family:var(--font-display);color:var(--copper);font-size:.82rem;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;margin-top:.5rem}

  .links{margin-top:2.2rem;display:flex;flex-direction:column;gap:.9rem}
  .link{display:flex;flex-direction:column;align-items:center;gap:.15rem;
    background:var(--card);border:1px solid var(--card-bd);border-radius:14px;padding:1.05rem 1.4rem;
    font-size:1.02rem;font-weight:600;letter-spacing:.01em;
    transition:transform .4s var(--ease),background .3s var(--ease),border-color .3s var(--ease)}
  .link .sub{font-weight:400;font-size:.78rem;color:var(--text-dim);letter-spacing:0}
  .link:hover{transform:translateY(-3px);border-color:var(--copper);background:rgba(255,255,255,.06)}
  .link.primary{background:linear-gradient(180deg,var(--copper),var(--copper-deep));
    border-color:transparent;color:#16100a;box-shadow:0 8px 22px rgba(192,138,86,.22)}
  .link.primary .sub{color:rgba(22,16,10,.72)}
  .link.primary:hover{transform:translateY(-3px);filter:brightness(1.06)}

  .brandmark{display:block;height:46px;margin:2.6rem auto 0;opacity:.95}
  .foot{margin-top:1rem;font-size:.78rem;font-weight:500;color:var(--text-dim);
    letter-spacing:.22em;text-transform:uppercase;opacity:.85}
</style>
</head>
<body>
  <div class="wrap">
    <div class="avatar-ring"><img class="avatar" src="Headshot.png" alt="Danielle Handelin" /></div>
    <h1 class="name">Danielle Handelin</h1>
    <div class="handle">TRACE Strategies</div>

    <div class="links">
      <a class="link primary" href="https://www.tracestrategies.com/TRACE-Audit-Workbook.html">
        Free TRACE Audit Workbook
        <span class="sub">Spot the gaps in your operations</span>
      </a>
      <a class="link secondary" href="https://www.tracestrategies.com">
        Visit TRACE Strategies
        <span class="sub">Explore services &amp; resources</span>
      </a>
    </div>

    <img class="brandmark" src="trace-logo.png" alt="TRACE Strategies" />

    <div class="foot">DANIELLEHANDELIN.COM</div>
  </div>
</body>
</html>

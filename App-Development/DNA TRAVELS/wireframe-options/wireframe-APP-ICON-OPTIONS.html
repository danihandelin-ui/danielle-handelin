<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA TRAVELS — App Icon Options</title>
<style>
  :root{
    --teal:#2d6a6a; --teal-deep:#1f4d4d; --teal-soft:#e8f2f2;
    --accent:#b4534b; --accent-deep:#8f3f38;
    --ink:#1c1917; --paper:#fffdf9; --bg:#f7f4ef; --muted:#78716c; --line:#e7e0d6;
    --gold:#d99a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:2rem 1rem 4rem;}
  .wrap{max-width:1000px;margin:0 auto;}
  header{text-align:center;margin-bottom:2rem;}
  header h1{font-size:1.6rem;color:var(--teal);}
  header p{color:var(--muted);margin-top:.4rem;font-size:.95rem;}
  .note{background:var(--teal-soft);border-radius:12px;padding:.85rem 1.1rem;font-size:.85rem;color:var(--teal-deep);max-width:620px;margin:1rem auto 0;text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;margin-top:2.5rem;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.5rem 1.25rem 1.25rem;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);}
  .card .opt-num{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft,#f5e8e6);padding:.2rem .6rem;border-radius:999px;margin-bottom:1rem;}
  .icon{width:120px;height:120px;border-radius:27px;display:block;margin:0 auto;box-shadow:0 6px 16px rgba(0,0,0,.18);overflow:hidden;}
  .icon svg{width:100%;height:100%;display:block;}
  .card h3{font-size:1rem;margin-top:1.1rem;color:var(--ink);}
  .card p{font-size:.82rem;color:var(--muted);margin-top:.35rem;line-height:1.4;}

  /* mini home-screen preview */
  .homescreen{margin-top:1.25rem;background:linear-gradient(160deg,#cfe3e3,#eef4ef);border-radius:14px;padding:1rem .5rem .75rem;}
  .hs-icon{width:54px;height:54px;border-radius:13px;margin:0 auto;box-shadow:0 3px 8px rgba(0,0,0,.22);overflow:hidden;}
  .hs-icon svg{width:100%;height:100%;display:block;}
  .hs-label{font-size:.62rem;color:#27343a;margin-top:.35rem;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DNA TRAVELS — App Icon Options</h1>
    <p>How the icon would look on your iPhone home screen. Pick a number and I'll wire it into the app.</p>
    <div class="note">📱 Each card shows a large preview plus a mini “on your home screen” mockup so you can see it at real size.</div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<script>
/* Each icon defined once as an SVG factory so the big + mini previews stay identical */
const R = 100; // viewBox 0..100
const ICONS = {
  helix: (bg, fg, fg2) => `
    <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>
      <g stroke="${fg}" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M35 18 C70 35,70 65,35 82"/>
        <path d="M65 18 C30 35,30 65,65 82"/>
      </g>
      <g stroke="${fg2}" stroke-width="4" stroke-linecap="round">
        <line x1="38" y1="30" x2="62" y2="30"/>
        <line x1="33" y1="42" x2="67" y2="42"/>
        <line x1="33" y1="58" x2="67" y2="58"/>
        <line x1="38" y1="70" x2="62" y2="70"/>
      </g>
    </svg>`,
  monogram: (bg, fg) => `
    <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>
      <text x="50" y="58" font-family="Georgia, serif" font-size="34" font-weight="700"
        fill="${fg}" text-anchor="middle" letter-spacing="1">DNA</text>
      <text x="50" y="76" font-family="-apple-system,sans-serif" font-size="9"
        fill="${fg}" opacity=".75" text-anchor="middle" letter-spacing="3">TRAVELS</text>
    </svg>`,
  pin: (bg, pin, dot) => `
    <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>
      <path d="M50 20 C36 20,26 31,26 45 C26 64,50 82,50 82 C50 82,74 64,74 45 C74 31,64 20,50 20 Z" fill="${pin}"/>
      <circle cx="50" cy="44" r="9" fill="${dot}"/>
    </svg>`,
  skyline: (bg, fg) => `
    <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>
      <g fill="${fg}">
        <rect x="20" y="55" width="10" height="27"/>
        <rect x="33" y="42" width="12" height="40"/>
        <rect x="48" y="30" width="9" height="52"/>
        <polygon points="52.5,22 49,30 56,30"/>
        <rect x="60" y="48" width="11" height="34"/>
        <rect x="74" y="58" width="8" height="24"/>
      </g>
      <circle cx="74" cy="34" r="7" fill="${fg}" opacity=".85"/>
    </svg>`,
  plane: (bg, fg) => `
    <svg viewBox="0 0 100 100"><defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#1f4d4d"/>
        </linearGradient></defs>
      <rect width="100" height="100" fill="url(#pg)"/>
      <path d="M28 70 L78 30 C82 27,84 31,81 35 L46 78 L41 65 L28 70 Z" fill="${fg}"/>
      <path d="M41 65 L46 78 L52 60 Z" fill="${fg}" opacity=".6"/>
    </svg>`,
  compass: (bg, ring, needle) => `
    <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>
      <circle cx="50" cy="50" r="28" fill="none" stroke="${ring}" stroke-width="4"/>
      <polygon points="50,28 57,50 50,46 43,50" fill="${needle}"/>
      <polygon points="50,72 43,50 50,54 57,50" fill="${ring}"/>
      <circle cx="50" cy="50" r="3.5" fill="${needle}"/>
    </svg>`,
};

const OPTIONS = [
  {n:1, name:"DNA Helix", svg:ICONS.helix("#fffdf9","#2d6a6a","#b4534b"),
   desc:"A literal nod to “DNA” — a double helix in your teal + terracotta. Clever and distinctive."},
  {n:2, name:"Monogram", svg:ICONS.monogram("#2d6a6a","#fffdf9"),
   desc:"Bold “DNA TRAVELS” wordmark on teal. Clean, brand-forward, reads instantly."},
  {n:3, name:"Location Pin", svg:ICONS.pin("#2d6a6a","#b4534b","#fffdf9"),
   desc:"Classic map pin — universally “this is a travel/places app.”"},
  {n:4, name:"NYC Skyline", svg:ICONS.skyline("#2d6a6a","#fffdf9"),
   desc:"A little skyline + sun. Warm and specifically NYC trip-planner."},
  {n:5, name:"Paper Plane", svg:ICONS.plane("#2d6a6a","#fffdf9"),
   desc:"Travel-forward paper plane on a teal gradient. Friendly and energetic."},
  {n:6, name:"Compass", svg:ICONS.compass("#fffdf9","#2d6a6a","#b4534b"),
   desc:"Explorer compass — “find your way around the city.”"},
];

document.getElementById('grid').innerHTML = OPTIONS.map(o => `
  <div class="card">
    <span class="opt-num">Option ${o.n}</span>
    <div class="icon">${o.svg}</div>
    <h3>${o.name}</h3>
    <p>${o.desc}</p>
    <div class="homescreen">
      <div class="hs-icon">${o.svg}</div>
      <div class="hs-label">DNA TRAVELS</div>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
